name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Offline verification (CPU only)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2, pinned to its published commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check host environment
        run: python3 tools/check_environment.py --target host --output build/host_environment.json
      - name: Offline check (repository manifest, Python oracles)
        run: python3 tools/offline_check.py
      - name: Configure (CMake)
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native --parallel 2
      - name: Test (CTest)
        run: ctest --test-dir build/native --output-on-failure

  verify-dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (includes typecheck)
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (changed commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$BASE..$GITHUB_SHA"; else RANGE="-1"; fi
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .

  notify:
    name: Notify failure
    if: failure() && github.event_name == 'push'
    needs: [verify, verify-dashboard, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: ${{ github.event.head_commit.message }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_URL not set; skipping"; exit 0; }
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "${GITHUB_SHA::7}" --arg msg "$(printf '%s' "$MSG" | head -n1 | cut -c1-200)" \
                --arg actor "$GITHUB_ACTOR" --arg url "$URL" \
            '{username: "mac-server-watchdog", allowed_mentions: {parse: []}, embeds: [{
               title: ("CI FAILED · " + $repo), url: $url, color: 15844367,
               description: ("**CI failed** on main.\n`" + $sha + "` " + $msg),
               fields: [{name: "Author", value: $actor, inline: true}, {name: "Logs", value: ("[Open run](" + $url + ")"), inline: true}],
               footer: {text: "GitHub Actions · CI gate"}, timestamp: (now | todate)}]}' \
          | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
